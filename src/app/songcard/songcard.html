<div class="card" style="width: 18rem;">
  <img [src]="songData.artworkUrl100" class="card-img-top">

  <div class="card-body">
    <h5 class="card-title">
      {{songData.trackName}}
    </h5>

    <p class="card-text">
      {{songData.artistName}}
    </p>

    <button class="btn btn-success">
      ▶ Play
    </button>
  </div>
</div>
